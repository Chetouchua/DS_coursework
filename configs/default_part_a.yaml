experiment: single_node_sanity
seed: 42
cluster:
  servers: 1
  replication: 0
consistency:
  mode: sequential
  tau: 0
model:
  num_keys: 1000000
  value_width: 1
  init: zeros
  learning_rate: 0.05
  target:
    dist: normal
    mean: 0.0
    std: 1.0
workers:
  count: 8
  iterations: 3
  compute_ms:
    dist: constant
    value: 5
  stragglers:
    fraction: 0.0
    slowdown: 1.0
  access:
    mode: sparse
    # range_size: 1000
    keys_per_iter: 5000
  gradient:
    type: target_diff
    noise_std: 0.0
output:
  dir: results/test
  observer_every: 1
